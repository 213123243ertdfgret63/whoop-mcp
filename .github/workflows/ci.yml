name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are scarce (jobs can queue until cancelled) and cost 10x minutes on private repos,
        # so pushes and PRs run on Ubuntu; trigger the workflow manually to include macOS.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    env:
      # Skip installing git hooks on CI runners.
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The Node Claude Desktop's built-in runtime has (24.22 in Desktop 4.4212); the smoke tests run the bundle on it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `prepare` also generates src/whoop/openapi.d.ts from openapi/whoop.yaml.
      - run: bun install --frozen-lockfile

      - name: Lint and format check
        if: runner.os == 'Linux'
        run: bunx biome ci .

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # The loopback server on real Node, which Desktop runs it on (bun test uses Bun's own node:http).
      - name: Test on Node
        run: bun run test:node

      # Validates the manifest, then runs the bundle on Node 24, the Node Claude Desktop runs it on.
      - name: Build the Claude Desktop extension
        run: |
          bun run build:mcpb
          mkdir -p dist/check && unzip -q dist/whoop-mcp-macos.mcpb -d dist/check
          test "$(node dist/check/server/index.mjs --version)" = "$(bun -p 'require("./package.json").version')"
